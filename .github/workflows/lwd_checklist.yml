name: LWD Checklist

on:
  workflow_call:

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-data-comm/ci-infra
          ref: main
          sparse-checkout: lwd_checks
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Relay the lane results into the checklist comment
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          LWD_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          LWD_GITHUB_TOKEN: ${{ github.token }}
        run: python -m lwd_checks.comment
