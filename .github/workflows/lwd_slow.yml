name: LWD Slow

on:
  workflow_call:
    inputs:
      upstream_repo:
        type: string
        required: true
        description: "owner/repo of the upstream project"

permissions:
  contents: read
  pull-requests: read

jobs:
  lwd-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check out lwd_checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-data-comm/ci-infra
          ref: main
          sparse-checkout: lwd_checks
          path: ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CPU torch and the runtime requirements
        run: |
          python -m pip install --quiet uv
          uv venv .venv-ci
          uv pip install --python .venv-ci/bin/python torch \
            --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv-ci/bin/python \
            -r requirements/common.txt pytest
      - name: Run the LWD test directories
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          passed="lwd-unit-tests"
          set +e
          for directory in $(PYTHONPATH=ci python -m lwd_checks.discover tests); do
            name=$(basename "$directory")
            PYTHONPATH=. .venv-ci/bin/pytest "$directory" --confcutdir="$directory" \
              -q --junitxml "junit/$name.xml"
          done
          set -e
          # shellcheck disable=SC2086
          PYTHONPATH=ci python -m lwd_checks.junit --xml junit/*.xml \
            --check-id "$passed" --lane slow \
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --out results/lwd-unit-tests.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lwd-results-slow-lwd-unit-tests
          path: results/lwd-unit-tests.json

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: vllm-data-comm/ci-infra/.github/actions/lwd_prepare@main
        with:
          upstream_repo: ${{ inputs.upstream_repo }}
      - name: Compute the PR's own scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PYTHONPATH=ci python -m lwd_checks.scope \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --upstream upstream/main --out scope.json --files-out own-files.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run mypy 3.12 on the PR's own files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install --quiet pre-commit
          if [ -s own-files.txt ]; then
            set +e
            # shellcheck disable=SC2046
            SKIP= pre-commit run --hook-stage manual mypy-3.12 \
              --files $(cat own-files.txt) > mypy.log 2>&1
            set -e
            PYTHONPATH=ci python -m lwd_checks.mypy_report \
              --log-file mypy.log --lane slow --pr "$PR_NUMBER" \
              --head-sha "$HEAD_SHA" --out results/mypy.json
          else
            PYTHONPATH=ci python -m lwd_checks.results report \
              --check-id mypy --status pass \
              --summary "no own files to check" \
              --lane slow --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" \
              --out results/mypy.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lwd-results-slow-mypy
          path: results/mypy.json

  lwd-slow-gate:
    needs: [lwd-unit-tests, mypy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: vllm-data-comm/ci-infra/.github/actions/lwd_prepare@main
        with:
          upstream_repo: ${{ inputs.upstream_repo }}
          product_checkout: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lwd-results-slow-*
          path: results
          merge-multiple: true
      - name: Read the no-test label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          no_test=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
            --json labels --jq '[.labels[].name] | index("no-test") != null' \
            || echo false)
          echo "no_test=$no_test" >> "$GITHUB_ENV"
      - name: Gate the slow lane
        run: |
          extra=""
          [ "$no_test" = "true" ] && extra="--no-test"
          PYTHONPATH=ci python -m lwd_checks.gate --lane slow \
            --results-dir results $extra
