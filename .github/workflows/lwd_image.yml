name: LWD Image

on:
  workflow_call:
    inputs:
      soc:
        type: string
        required: true
        description: "SoC variant: a2 or a3"
      vllm_ref:
        type: string
        default: main
        description: "vllm fork ref to build from"
      vllm_ascend_ref:
        type: string
        default: main
        description: "vllm-ascend fork ref to build from"
      base_tag:
        type: string
        default: ""
        description: "override the pinned official base image tag"
      push:
        type: boolean
        default: false
        description: "push the image to ghcr.io"
      nightly:
        type: boolean
        default: false
        description: "also move the rolling nightly tag"

# A reusable workflow's own permissions block applies and can only narrow
# the caller's grant, so packages: write must be restated here: without it
# the caller's grant is dropped and the ghcr.io push is denied.
permissions:
  contents: read
  packages: write

env:
  LWD_IMAGE: ghcr.io/vllm-data-comm/lwd
  QUAY_IMAGE: quay.io/vllm-data-comm/lwd

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Move docker's data root to the larger disk
        run: |
          sudo systemctl stop docker
          sudo mv /var/lib/docker /mnt/docker
          printf '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          # The default docker driver cannot push; use a container builder.
          docker buildx create --use
          df -h / /mnt

      - name: Check out the vllm fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-data-comm/vllm
          ref: ${{ inputs.vllm_ref }}
          path: ctx/vllm
      - name: Check out the vllm-ascend fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-data-comm/vllm-ascend
          ref: ${{ inputs.vllm_ascend_ref }}
          path: ctx/vllm-ascend
      - name: Check out the Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vllm-data-comm/ci-infra
          ref: main
          path: ci
          sparse-checkout: docker

      - name: Resolve the build parameters
        run: |
          case "${{ inputs.soc }}" in
            a2) suffix="" ; default_base="v0.30.0rc1" ;;
            a3) suffix="-a3" ; default_base="v0.30.0rc1-a3" ;;
            *) echo "unsupported soc: ${{ inputs.soc }}" >&2 ; exit 1 ;;
          esac
          base_tag="${{ inputs.base_tag }}"
          if [ -z "$base_tag" ]; then base_tag="$default_base"; fi
          vllm_sha=$(git -C ctx/vllm rev-parse --short HEAD)
          vllm_ascend_sha=$(git -C ctx/vllm-ascend rev-parse --short HEAD)
          {
            echo "suffix=$suffix"
            echo "base_tag=$base_tag"
            echo "vllm_sha=$vllm_sha"
            echo "vllm_ascend_sha=$vllm_ascend_sha"
          } >> "$GITHUB_ENV"
          {
            echo "### LWD image (${{ inputs.soc }})"
            echo "- vllm: \`${{ inputs.vllm_ref }}\` @ \`${vllm_sha}\`"
            echo "- vllm-ascend: \`${{ inputs.vllm_ascend_ref }}\` @ \`${vllm_ascend_sha}\`"
            echo "- image: \`${LWD_IMAGE}\`, layered on base tag \`${base_tag}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to ghcr.io
        if: ${{ inputs.push }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          printf '**/.git\n' > ctx/.dockerignore
          tag_names="sha-${vllm_sha}${suffix}"
          tags=(--tag "${LWD_IMAGE}:${tag_names}")
          output=(--load)
          if [ "${{ inputs.push }}" = true ]; then
            output=(--push)
            tag_names="${tag_names} nightly-$(date -u +%Y%m%d)${suffix}"
            if [ "${{ inputs.nightly }}" = true ]; then
              tag_names="${tag_names} nightly${suffix}"
            fi
            echo "tag_names=${tag_names}" >> "$GITHUB_ENV"
            for name in ${tag_names}; do
              tags+=(--tag "${LWD_IMAGE}:${name}")
            done
          fi
          docker buildx build \
            --file ci/docker/Dockerfile.lwd \
            --platform linux/arm64 \
            --build-arg BASE_TAG="${base_tag}" \
            "${tags[@]}" \
            "${output[@]}" \
            ctx

      - name: Mirror the image to quay.io
        if: ${{ inputs.push }}
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          if [ -z "${QUAY_USERNAME}" ] || [ -z "${QUAY_PASSWORD}" ]; then
            echo "no quay credentials passed, skipping the mirror"
            exit 0
          fi
          echo "${QUAY_PASSWORD}" | docker login quay.io -u "${QUAY_USERNAME}" --password-stdin
          tags=()
          for name in ${tag_names}; do
            tags+=(--tag "${QUAY_IMAGE}:${name}")
          done
          # The layers are already in the local builder cache, so this build
          # only uploads them to quay.io.
          docker buildx build \
            --file ci/docker/Dockerfile.lwd \
            --platform linux/arm64 \
            --build-arg BASE_TAG="${base_tag}" \
            "${tags[@]}" \
            --push \
            ctx

      - name: Inspect the pushed image
        if: ${{ inputs.push }}
        run: docker buildx imagetools inspect "${LWD_IMAGE}:sha-${vllm_sha}${suffix}"
